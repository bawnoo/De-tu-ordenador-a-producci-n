<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Del portátil a producción</title>
<meta name="description" content="Tutorial paso a paso, con animaciones, sobre cómo llega el código desde el ordenador de quien programa hasta producción.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root {
  --floor: #D9DCD4;
  --floor-2: #D1D5CB;
  --grid: #C0C5BA;
  --panel: #EEF0EA;
  --panel-2: #E3E6DE;
  --ink: #1D231F;
  --ink-2: #505A53;
  --machine: #5A645C;
  --machine-2: #7B867D;
  --belt: #3E4640;
  --safety: #F2B705;
  --safety-ink: #1D231F;
  --alarm: #CF2338;
  --warn: #D9730D;
  --ok: #2B8653;
  --test: #19798A;
  --m-login: #2F5BD3;
  --m-carrito: #BF3D86;
  --m-pagos: #6A3FC1;
  --focus: #1B62D6;
  --shade: rgba(29, 35, 31, 0.18);
  --scrim: rgba(217, 220, 212, 0.82);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --floor: #1B201D;
    --floor-2: #1F2521;
    --grid: #2C342F;
    --panel: #242B27;
    --panel-2: #2C342F;
    --ink: #E4E8E1;
    --ink-2: #A2ACA4;
    --machine: #7F8A81;
    --machine-2: #98A399;
    --belt: #3A433D;
    --safety: #F2B705;
    --safety-ink: #1D231F;
    --alarm: #FF5A6D;
    --warn: #FF9D3A;
    --ok: #4BC78B;
    --test: #3FB7C8;
    --m-login: #6F8FF2;
    --m-carrito: #EC6DB2;
    --m-pagos: #A487F1;
    --focus: #7AA7FF;
    --shade: rgba(0, 0, 0, 0.35);
    --scrim: rgba(27, 32, 29, 0.84);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --floor: #1B201D;
  --floor-2: #1F2521;
  --grid: #2C342F;
  --panel: #242B27;
  --panel-2: #2C342F;
  --ink: #E4E8E1;
  --ink-2: #A2ACA4;
  --machine: #7F8A81;
  --machine-2: #98A399;
  --belt: #3A433D;
  --safety: #F2B705;
  --safety-ink: #1D231F;
  --alarm: #FF5A6D;
  --warn: #FF9D3A;
  --ok: #4BC78B;
  --test: #3FB7C8;
  --m-login: #6F8FF2;
  --m-carrito: #EC6DB2;
  --m-pagos: #A487F1;
  --focus: #7AA7FF;
  --shade: rgba(0, 0, 0, 0.35);
  --scrim: rgba(27, 32, 29, 0.84);
  color-scheme: dark;
}

/* ---------- Base ---------- */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --f-ui: 'Barlow', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-code: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  overflow-x: clip;
  background: var(--floor);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
code, .mono { font-family: var(--f-code); font-size: 0.88em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Barra superior ---------- */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--grid);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
}
.brand {
  display: flex; align-items: center; gap: 10px; flex: none; white-space: nowrap;
  background: none; border: 0; padding: 4px 6px 4px 0; cursor: pointer;
  font-family: var(--f-display); font-weight: 600; font-size: 21px; letter-spacing: 0.005em;
}
.brand-mark { width: 30px; height: 30px; flex: none; }
.topbar .where { color: var(--ink-2); font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .spacer { flex: 1; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 16px;
  border-radius: 6px; border: 1px solid var(--grid);
  background: var(--panel); cursor: pointer;
  font-weight: 500; font-size: 15px; line-height: 1.1;
  white-space: nowrap;
}
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--safety); color: var(--safety-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.quiet:hover { color: var(--ink); background: var(--panel-2); }
.btn svg { width: 18px; height: 18px; flex: none; }


/* ---------- Tutorial ---------- */
:root { --tb: 61px; }
a { color: inherit; }
.brand { text-decoration: none; color: inherit; }
#btnToc { display: none; }
.topbar .btn { text-decoration: none; }
.icon-btn { padding: 8px 10px; min-width: 40px; }
.icon-btn svg { width: 20px; height: 20px; }
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); align-items: start; }
.toc { position: sticky; top: var(--tb); max-height: calc(100vh - var(--tb)); overflow-y: auto; border-right: 1px solid var(--grid); background: var(--panel); padding: 16px 12px 40px; }
.toc a { text-decoration: none; }
.toc-link { display: block; padding: 7px 10px; border-radius: 6px; font-weight: 600; }
.toc-link:hover { background: var(--panel-2); }
.toc-chapters { list-style: none; margin: 4px 0 12px; padding: 0; }
.toc .ch { margin-top: 12px; }
.toc .ch-title { display: flex; gap: 8px; align-items: baseline; padding: 4px 10px; font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.2; }
.toc .ch-num { color: var(--machine-2); min-width: 1.3em; font-variant-numeric: tabular-nums; }
.toc .steps { list-style: none; margin: 2px 0 0; padding: 0; }
.toc .steps a { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 37px; border-radius: 6px; font-size: 15px; line-height: 1.3; }
.toc .steps a:hover { background: var(--panel-2); }
.toc .steps a[aria-current="page"] { background: var(--ink); color: var(--floor); }
.toc .seen { width: 15px; height: 15px; flex: none; margin-left: auto; color: var(--ok); visibility: hidden; }
.toc .is-seen .seen { visibility: visible; }
.toc a[aria-current="page"] .seen { color: var(--floor); }
.toc .soon .ch-title { color: var(--ink-2); }
.toc .terms { margin: 2px 0 0; padding: 0 10px 0 37px; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
#view { min-width: 0; outline: none; }

.lesson { max-width: 900px; margin: 0 auto; padding: 26px 32px 72px; }
.crumb { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--ink-2); font-size: 15px; margin: 0; }
.ch-progress { height: 4px; border-radius: 2px; background: var(--panel-2); margin: 8px 0 18px; overflow: hidden; }
.ch-progress i { display: block; height: 100%; background: var(--safety); }
.lesson h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(38px, 5.4vw, 58px); line-height: 1; margin: 0 0 16px; letter-spacing: -0.01em; }
.lesson .intro { font-size: 17px; color: var(--ink-2); margin: -4px 0 18px; max-width: 64ch; }
.stage { position: relative; margin: 0; background-color: var(--floor-2); background-image: radial-gradient(var(--grid) 1.1px, transparent 1.4px); background-size: 26px 26px; border: 1px solid var(--grid); border-radius: 12px; overflow: hidden; }
.stage > svg { display: block; width: 100%; height: auto; }
.stage-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--grid); background: var(--panel); }
.stage-bar .btn { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.stage-bar .track { flex: 1; height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; margin-left: 4px; }
.stage-bar .track i { display: block; height: 100%; width: 0; background: var(--ink-2); }
.cap { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 66px; background: var(--panel); border-top: 1px solid var(--grid); }
.cap p { flex: 1; margin: 0; font-size: 17px; line-height: 1.4; }
.cap-num { color: var(--ink-2); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cap-btn { flex: none; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid var(--grid); background: var(--floor); color: var(--ink); cursor: pointer; }
.cap-btn:hover { background: var(--panel-2); }
.cap-btn svg { width: 20px; height: 20px; }
.cap-btn.nudge { background: var(--safety); color: var(--safety-ink); border-color: transparent; }
.btn.toggle[aria-pressed="true"] { background: var(--ink); color: var(--floor); }
.stage-bar .track { position: relative; overflow: visible; }
#ticks b { position: absolute; top: -3px; width: 2px; height: 10px; margin-left: -1px; background: var(--machine-2); border-radius: 1px; }
.more { margin-top: 16px; max-width: 70ch; border: 1px solid var(--grid); border-radius: 8px; background: var(--panel); }
.more summary { display: flex; align-items: center; gap: 8px; padding: 11px 16px; cursor: pointer; list-style: none; font-family: var(--f-display); font-weight: 600; font-size: 19px; }
.more summary::-webkit-details-marker { display: none; }
.more .more-ico { width: 18px; height: 18px; flex: none; transition: transform 0.2s ease; }
.more[open] .more-ico { transform: rotate(45deg); }
.more-body { padding: 0 16px 6px; }
.more-body p { margin: 0 0 12px; }
.more-body a { text-decoration-color: var(--machine-2); }
.text { margin-top: 22px; font-size: 18px; line-height: 1.6; max-width: 66ch; }
.text p { margin: 0 0 14px; }
.text b { font-weight: 600; }
.real { margin-top: 20px; max-width: 70ch; background: var(--panel); border: 1px solid var(--grid); border-left: 4px solid var(--safety); border-radius: 0 8px 8px 0; padding: 12px 16px 14px; }
.real h2 { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 0 0 4px; }
.real p { margin: 0; }
.real pre { margin: 10px 0 0; padding: 12px 14px; background: #1d231f; color: #e4e8e1; border-radius: 6px; overflow-x: auto; font-family: var(--f-code); font-size: 14px; line-height: 1.55; }
code { font-family: var(--f-code); font-size: 0.9em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--grid); }
.pager .btn { min-width: 0; max-width: 49%; text-decoration: none; }
.pager .btn span { overflow: hidden; text-overflow: ellipsis; }
.next-soon { color: var(--ink-2); font-size: 15px; margin-top: 12px; }

.home { max-width: 1060px; margin: 0 auto; padding: 36px 32px 72px; }
.hero { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 32px; align-items: center; }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(44px, 6.4vw, 82px); line-height: 0.92; margin: 0 0 18px; letter-spacing: -0.012em; }
.lede { font-size: 19px; line-height: 1.5; margin: 0 0 12px; max-width: 52ch; }
.lede2 { color: var(--ink-2); margin: 0 0 20px; max-width: 52ch; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.cta .btn { text-decoration: none; }
.done-note { color: var(--ink-2); font-size: 15px; margin: 12px 0 0; }
.sec { font-family: var(--f-display); font-weight: 600; font-size: 30px; margin: 52px 0 10px; }
.chapters { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--grid); }
.ch-row { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--grid); }
.ch-row .num { font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1; text-align: center; }
.ch-row.soon .num, .ch-row.soon h3 { color: var(--machine-2); }
.ch-row h3 { font-family: var(--f-display); font-weight: 600; font-size: 23px; margin: 0 0 2px; }
.ch-row h3 a { text-decoration: none; }
.ch-row h3 a:hover { text-decoration: underline; }
.ch-row p { margin: 0; color: var(--ink-2); max-width: 72ch; }
.ch-row .ch-terms { margin-top: 6px; font-size: 15px; color: var(--ink); }
.ch-row .ch-terms a { text-decoration-color: var(--machine-2); }
.ch-row.soon .ch-terms { color: var(--ink-2); }
.soon-tag { font-weight: 600; }

.gloss { max-width: 880px; margin: 0 auto; padding: 32px 32px 72px; }
.gloss h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(40px, 5.4vw, 60px); line-height: 1; margin: 0 0 12px; }
.gloss dl { margin: 22px 0 0; border-top: 1px solid var(--grid); }
.g-item { padding: 12px 0; border-bottom: 1px solid var(--grid); display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 4px 20px; }
.g-item dt { font-weight: 600; font-size: 17px; }
.g-item dt a { text-decoration-color: var(--machine-2); }
.g-item dd { margin: 0; }
.g-item .where { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.soon-list { color: var(--ink-2); max-width: 72ch; }

.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 900px) {
  #btnToc { display: inline-flex; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .toc { position: fixed; top: var(--tb); left: 0; bottom: 0; z-index: 40; width: min(330px, 88vw); max-height: none; transform: translateX(-102%); transition: transform 0.22s ease; box-shadow: 0 10px 40px var(--shade); }
  body.toc-open .toc { transform: none; }
  .hero { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  :root { --tb: 57px; }
  .topbar { padding: 8px 12px; gap: 8px; }
  .brand > span { display: none; }
  .lesson, .home, .gloss { padding: 20px 16px 56px; }
  .text { font-size: 17px; }
  .g-item { grid-template-columns: minmax(0, 1fr); }
  .stage-bar .btn { padding: 6px 8px; }
  .stage-bar { flex-wrap: wrap; }
  .stage-bar .track { flex-basis: 100%; margin: 4px 0 2px; }
  .cap p { font-size: 16px; }
  .pager { flex-direction: column; }
  .pager .btn { max-width: none; }
  .ch-row { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; }
  .ch-row .num { font-size: 30px; }
}
.rotate-hint { display: none; }
@media (max-width: 640px) and (orientation: portrait) {
  .lesson .stage { margin: 0 -16px; border-radius: 0; border-left: 0; border-right: 0; }
  .rotate-hint { display: block; color: var(--ink-2); font-size: 14px; margin: 8px 0 0; }
}
@media (prefers-reduced-motion: reduce) { .blink, .spin { animation: none; } .toc { transition: none; } }
</style>
</head>
<body>
<header class="topbar">
  <button class="btn quiet" id="btnToc" type="button" aria-controls="toc" aria-expanded="false">Índice</button>
  <a class="brand" href="#inicio" aria-label="Del portátil a producción: inicio">
    <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true">
      <rect x="1" y="1" width="28" height="28" rx="5" fill="var(--safety)"/>
      <rect x="4" y="11" width="22" height="8" rx="2" fill="var(--safety-ink)"/>
      <path d="M9 13.2 L11.6 15 L9 16.8 M15 13.2 L17.6 15 L15 16.8" stroke="var(--safety)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="22.5" cy="15" r="1.7" fill="var(--safety)"/>
    </svg>
    <span>Del portátil a producción</span>
  </a>
  <span class="spacer"></span>
  <a class="btn quiet" href="#glosario">Glosario</a>
  <button class="btn quiet icon-btn" id="btnMusic" type="button" aria-label="Música" title="Música"></button>
  <button class="btn quiet icon-btn" id="btnSfx" type="button" aria-label="Efectos de sonido" title="Efectos de sonido"></button>
</header>
<div class="app">
  <nav class="toc" id="toc" aria-label="Índice de capítulos"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<script>
/* =====================================================================
   SONIDO
   Efectos y música generados con Web Audio: no hay archivos de audio.
   El navegador solo deja sonar audio tras un gesto del jugador, así que
   todo arranca en el primer clic o tecla.
   ===================================================================== */

const Sound = (() => {
  const KEY = 'fabrica-despliegues-audio';
  const prefs = (() => {
    try { return Object.assign({ music: true, sfx: true }, JSON.parse(localStorage.getItem(KEY) || '{}')); }
    catch (e) { return { music: true, sfx: true }; }
  })();
  const MUSIC_VOL = 0.3, SFX_VOL = 0.55;
  let ctx = null, sfxBus = null, musicBus = null, noiseBuf = null;
  let mood = 'menu', stepN = 0, nextTime = 0;
  const lastPlayed = {};

  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) { /* sin almacenamiento */ } };

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 4;
    const master = ctx.createGain(); master.gain.value = 0.9;
    sfxBus = ctx.createGain(); sfxBus.gain.value = prefs.sfx ? SFX_VOL : 0;
    musicBus = ctx.createGain(); musicBus.gain.value = prefs.music ? MUSIC_VOL : 0;
    sfxBus.connect(master); musicBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.6), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextTime = ctx.currentTime + 0.12;
    setInterval(schedule, 25);
    return true;
  }

  /* ---------- Bloques básicos ---------- */
  function tone(bus, o) {
    const t0 = o.t || ctx.currentTime;
    const a = o.a || 0.005, d = o.d || 0.15, g = o.g || 0.2;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + a + d);
    if (o.detune) osc.detune.value = o.detune;
    const v = ctx.createGain();
    v.gain.setValueAtTime(0.0001, t0);
    v.gain.exponentialRampToValueAtTime(g, t0 + a);
    v.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    let node = osc;
    if (o.lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; fl.Q.value = 0.7; osc.connect(fl); node = fl; }
    node.connect(v); v.connect(bus);
    osc.start(t0); osc.stop(t0 + a + d + 0.05);
  }

  function noise(bus, o) {
    const t0 = o.t || ctx.currentTime, d = o.d || 0.1;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = o.type || 'bandpass';
    fl.frequency.setValueAtTime(o.f || 2000, t0);
    if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + d);
    fl.Q.value = o.q || 1;
    const v = ctx.createGain();
    v.gain.setValueAtTime(o.g || 0.2, t0);
    v.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(fl); fl.connect(v); v.connect(bus);
    src.start(t0); src.stop(t0 + d + 0.02);
  }

  const seq = (notes, gap, o) => {
    const t = ctx.currentTime;
    notes.forEach((n, i) => tone(sfxBus, Object.assign({ f: midi(n), t: t + i * gap }, o)));
  };

  /* ---------- Efectos ---------- */
  const SFX = {
    place:     () => { tone(sfxBus, { f: 320, f2: 170, type: 'triangle', d: 0.07, g: 0.3 }); noise(sfxBus, { d: 0.03, g: 0.06, f: 1800 }); },

  db: a => `<path d="M-40 -34v68a40 12 0 0 0 80 0v-68" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>` +
    `<ellipse cx="0" cy="-34" rx="40" ry="12" fill="var(--panel-2)" stroke="var(--ink)" stroke-width="3"/>` +
    `<path d="M-40 -8a40 12 0 0 0 80 0M-40 16a40 12 0 0 0 80 0" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".45"/>` +
    (a.label ? T(0, 66, a.label, { size: 14, weight: 600 }) : '') + badge(a.badge, 36, -40, 12),

  /* Tabla: cols (cabeceras), rows (filas de textos); hrow/hcol resaltan una fila o columna (hc: color). */
  table: a => {
    const cols = a.cols || [], rows = a.rows || [], cw = a.cw || 110, rh = 28, w = cols.length * cw, h = (rows.length + 1) * rh;

      `<rect x="${-w / 2 + 1}" y="${-h / 2 + 1}" width="${w - 2}" height="${rh - 1}" rx="5" fill="var(--panel-2)"/>`;

      T(42, 1, on ? 'encendido' : 'apagado', { size: 14, anchor: 'start', weight: 600, color: on ? 'var(--ok)' : 'var(--ink-2)' }) +

  /* Multitud: n personas en filas de cols; las k primeras en color c2 (o alternas si ab). */
  crowd: a => {
    const n = a.n || 20, cols = a.cols || 10, sp = a.sp || 34, k = Math.round(a.k || 0), rowsN = Math.ceil(n / cols);

  /* Gráfica: vals; p dibuja la línea de izquierda a derecha; th marca un límite. */
  chart: a => {
    const vals = a.vals || [], w = a.w || 300, h = a.h || 120, max = a.max || Math.max(1, ...vals);
    const pts = vals.map((v, i) => [(-w / 2 + i * w / Math.max(1, vals.length - 1)).toFixed(1), (h / 2 - (v / max) * h).toFixed(1)]);

    if (a.title) s += T(-w / 2 - 10, -h / 2 - 26, a.title, { size: 14, weight: 600, anchor: 'start', color: 'var(--ink-2)' });

  flash: a => `<circle r="${a.R || 90}" fill="#ffffff"/>`,

  camera: () => `<rect x="-30" y="-18" width="60" height="40" rx="7" fill="var(--ink)"/><rect x="-14" y="-26" width="22" height="10" rx="3" fill="var(--ink)"/><circle cx="0" cy="2" r="12" fill="var(--panel)"/><circle cx="0" cy="2" r="6" fill="var(--test)"/>`,

const DEFS = '<defs><pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
  '<rect width="12" height="12" fill="var(--safety)"/><rect width="6" height="12" fill="var(--safety-ink)"/></pattern></defs>';
const ABSOLUTE = { line: 1, curve: 1, route: 1 };

/* ---------- Escena ----------
   Las fases vienen de la narración (opts.say: [[segundo, texto], ...]).
   En modo automático la animación se detiene HOLD segundos al final de cada
   fase para que dé tiempo a leer; en modo paso a paso espera a que se pulse
   "siguiente". */
function createScene(svg, def, opts) {
  opts = opts || {};
  svg.setAttribute('viewBox', '0 0 ' + VB_W + ' ' + VB_H);
  svg.innerHTML = DEFS;
  const actors = Object.keys(def.actors).map(id => {
    const [type, x, y, props] = def.actors[id];
    const g = document.createElementNS(SVGNS, 'g');
    svg.appendChild(g);
    return { id, type, g, base: Object.assign({ x, y, o: 1, s: 1, r: 0 }, props || {}), html: null };
  });
  const tl = def.tl.slice().sort((a, b) => a[0] - b[0]);
  const total = def.dur || Math.max(1, ...tl.map(e => e[0] + (typeof e[3] === 'number' ? e[3] : 0))) + 0.4;
  const say = (opts.say && opts.say.length) ? opts.say.slice().sort((a, b) => a[0] - b[0]) : [[0, '']];
  const starts = say.map(x => Math.min(x[0], total));
  const SPEED = opts.speed || 0.85, HOLD = opts.hold === undefined ? 2 : opts.hold, END_HOLD = 2.6;
  let s = 0, phase = 0, pending = null, holdLeft = 0, waiting = false, endLeft = 0;
  let playing = opts.autoplay !== false, stepMode = !!opts.stepMode, loop = 0, raf = 0, last = 0, onTick = null, dead = false;

  function stateAt(A, time) {
    const cur = Object.assign({}, A.base);
    for (const e of tl) {
      if (e[1] !== A.id) continue;
      if (time < e[0]) break;
      const ch = e[2], dur = e[3] || 0;
      const p = dur > 0 ? easeIO(Math.min(1, (time - e[0]) / dur)) : 1;
      if (ch.arc) {
        const [x1, y1, lift] = ch.arc, x0 = cur.x, y0 = cur.y;
        const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - 2 * (lift === undefined ? 80 : lift), q = 1 - p;
        cur.x = q * q * x0 + 2 * q * p * cx + p * p * x1;
        cur.y = q * q * y0 + 2 * q * p * cy + p * p * y1;
      }
      for (const k in ch) {
        if (k === 'arc') continue;
        const v = ch[k];
        if (typeof v === 'number') { const from = typeof cur[k] === 'number' ? cur[k] : 0; cur[k] = from + (v - from) * p; }
        else cur[k] = v;
      }
    }
    return cur;
  }

  function render(time) {
    for (const A of actors) {
      const c = stateAt(A, time);
      const draw = ACTORS[A.type];
      const html = draw ? draw(c) : '';
      if (html !== A.html) { A.g.innerHTML = html; A.html = html; }
      A.g.setAttribute('transform', ABSOLUTE[A.type] ? '' :
        'translate(' + c.x.toFixed(2) + ' ' + c.y.toFixed(2) + ')' + (c.r ? ' rotate(' + c.r.toFixed(1) + ')' : '') + (c.s !== 1 ? ' scale(' + c.s.toFixed(3) + ')' : ''));
      A.g.setAttribute('opacity', Math.max(0, Math.min(1, c.o)).toFixed(3));
    }
  }

  const fire = (a, b) => { if (loop > 0 || !opts.sound) return; for (const e of tl) if (e[1] === 'sfx' && e[0] > a && e[0] <= b) opts.sound(e[2]); };
  const announce = () => { if (opts.onPhase) opts.onPhase(phase, say[phase][1], say.length); };
  const tick = () => { if (onTick) onTick(s / total); };
  const wait = () => { waiting = true; playing = false; if (opts.onWait) opts.onWait(); };

  function restartInternal(fresh) {
    s = 0; phase = 0; pending = null; holdLeft = 0; waiting = false; endLeft = 0;
    loop = fresh ? 0 : loop + 1;
    render(0); tick(); announce();
  }

  function advance(dt) {
    if (holdLeft > 0) {
      holdLeft -= dt;
      if (holdLeft <= 0) { holdLeft = 0; phase = pending; pending = null; announce(); }
      return;
    }
    if (s >= total) {
      endLeft -= dt;
      if (endLeft <= 0) restartInternal(false);
      return;
    }
    const next = phase + 1 < starts.length ? starts[phase + 1] : Infinity;
    const ns = s + dt * SPEED;
    if (ns >= next) {
      fire(s, next); s = next; render(s); tick();
      pending = phase + 1;
      if (stepMode) wait(); else holdLeft = HOLD;
      return;
    }
    if (ns >= total) {
      fire(s, total); s = total; render(s); tick();
      endLeft = END_HOLD;
      if (stepMode) wait();
      return;
    }
    fire(s, ns); s = ns; render(s); tick();
  }

  function frame(now) {
    if (dead) return;
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    if (playing) advance(dt);
    raf = requestAnimationFrame(frame);
  }

  render(0); tick(); announce();
  raf = requestAnimationFrame(frame);

  const api = {
    get playing() { return playing; },
    get waiting() { return waiting; },
    get total() { return total; },
    get phase() { return phase; },
    get phases() { return say.length; },
    set onTick(fn) { onTick = fn; tick(); },
    play() { if (waiting) { api.next(); return; } if (s >= total) restartInternal(true); playing = true; last = 0; },
    pause() { playing = false; },
    restart() { restartInternal(true); playing = true; last = 0; },
    next() {
      last = 0;
      if (waiting || holdLeft > 0) {
        waiting = false; holdLeft = 0;
        if (s >= total) restartInternal(true);
        else if (pending !== null) { phase = pending; pending = null; announce(); }
        playing = true;
        return;
      }
      if (s >= total) { restartInternal(true); playing = true; return; }
      if (phase + 1 < starts.length) { phase++; s = starts[phase]; render(s); tick(); announce(); }
      else { s = total; render(s); tick(); endLeft = END_HOLD; if (stepMode) { wait(); return; } }
      playing = true;
    },
    prev() {
      last = 0; waiting = false; holdLeft = 0; pending = null;
      const target = (s - starts[phase] > 0.6 || phase === 0) ? phase : phase - 1;
      phase = target; s = starts[target]; render(s); tick(); announce();
      playing = true;
    },
    setStepMode(v) { stepMode = v; if (!v && waiting) api.next(); },
    showEnd() { s = total; phase = starts.length - 1; playing = false; render(total); tick(); announce(); },
    seek(time) {
      s = Math.max(0, Math.min(total, time));
      phase = 0;
      for (let i = 0; i < starts.length; i++) if (starts[i] <= s) phase = i;
      playing = false; render(s); tick(); announce();
    },
    phaseStarts() { return starts.map(x => x / total); },
    destroy() { dead = true; cancelAnimationFrame(raf); },
  };
  return api;
}

   CONTENIDO
   Cada capítulo tiene una lista de pasos, y cada paso explica un concepto:
     term     nombre del concepto (también aparece en el glosario)
     short    definición de una línea para el glosario
     text     párrafos: primero una analogía cotidiana, luego el concepto
     real     cómo se ve en la vida real (opcional, con código)
     scene    la animación: actores + línea de tiempo (ver t-engine.js)
   Los capítulos sin pasos todavía muestran solo sus conceptos en el índice.
   ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

const STEPS = [];
CHAPTERS.forEach(ch => (ch.steps || []).forEach((st, i) => {
  Object.assign(st, (typeof EXTRA !== 'undefined' && EXTRA[st.term]) || {});
  STEPS.push({ ch, i, st, id: 'c' + ch.n + '-' + (i + 1) });
}));

const KEY = 'del-portatil-a-produccion-v1';
const store = (() => {
  try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); return v && Array.isArray(v.seen) ? v : { seen: [], last: null }; }
  catch (e) { return { seen: [], last: null }; }
})();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* sin almacenamiento */ } };

let scene = null, current = -1;
const view = $('#view'), toc = $('#toc');

function destroyScene() { if (scene) { scene.destroy(); scene = null; } }

/* ---------- Índice lateral ---------- */
function buildToc() {
  let h = '<a class="toc-link" href="#inicio">Inicio</a><ol class="toc-chapters">';
  for (const ch of CHAPTERS) {
    h += '<li class="ch' + (ch.steps ? '' : ' soon') + '"><div class="ch-title"><span class="ch-num">' + ch.n + '</span><span>' + esc(ch.title) + '</span></div>';
    if (ch.steps) {
      h += '<ol class="steps">' + ch.steps.map((st, i) => {
        const id = 'c' + ch.n + '-' + (i + 1);
        return '<li><a href="#' + id + '" data-id="' + id + '"><span>' + esc(st.term) + '</span>' + ICON.check + '</a></li>';
      }).join('') + '</ol>';
    } else {
      h += '<p class="terms">Próximamente: ' + ch.terms.map(esc).join(', ') + '.</p>';
    }
    h += '</li>';
  }
  h += '</ol><a class="toc-link" href="#glosario">Glosario</a>';
  toc.innerHTML = h;
}

function updateToc() {
  const id = current >= 0 ? STEPS[current].id : null;
  toc.querySelectorAll('[data-id]').forEach(a => {
    if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    a.classList.toggle('is-seen', store.seen.includes(a.dataset.id));
  });
  const active = toc.querySelector('[aria-current="page"]');
  if (active && window.matchMedia('(min-width: 901px)').matches) active.scrollIntoView({ block: 'nearest' });
}

/* ---------- Inicio ---------- */
function renderHome() {
  destroyScene();
  current = -1;
  const resume = store.last && STEPS.find(s => s.id === store.last);
  const done = STEPS.filter(s => store.seen.includes(s.id)).length;
  const demo = STEPS.find(s => s.st.term === 'Desplegar');
  let rows = '';
  for (const ch of CHAPTERS) {
    const terms = ch.steps
      ? ch.steps.map((st, i) => '<a href="#c' + ch.n + '-' + (i + 1) + '">' + esc(st.term) + '</a>').join(', ')
      : ch.terms.map(esc).join(', ');
    rows += '<li class="ch-row' + (ch.steps ? '' : ' soon') + '"><span class="num" aria-hidden="true">' + ch.n + '</span><div>' +
      '<h3>' + (ch.steps ? '<a href="#c' + ch.n + '-1">' + esc(ch.title) + '</a>' : esc(ch.title)) + '</h3>' +
      '<p>' + esc(ch.intro) + '</p><p class="ch-terms">' + (ch.steps ? '' : '<span class="soon-tag">Próximamente.</span> ') + terms + '</p></div></li>';
  }
  view.innerHTML =
    '<section class="home">' +
      '<div class="hero">' +
        '<div class="hero-text">' +
          '<h1>Del portátil a producción</h1>' +
          '<p class="lede">Un recorrido paso a paso, con animaciones, por todo lo que le pasa al código desde que alguien lo escribe en su ordenador hasta que lo usan miles de personas. No hace falta saber programar.</p>' +
          '<p class="lede2">Cada paso explica una sola idea: primero con un ejemplo de la vida cotidiana y después con su nombre técnico. El orden es el mismo en el que ocurren las cosas en un equipo de verdad.</p>' +
          '<div class="cta"><a class="btn primary" href="#' + (resume ? resume.id : STEPS[0].id) + '">' + (resume ? 'Seguir donde lo dejaste' : 'Empezar') + '</a>' +
          '<a class="btn" href="#glosario">Ver el glosario</a></div>' +
          (done ? '<p class="done-note">Has visto ' + done + ' de ' + STEPS.length + ' conceptos.</p>' : '') +
        '</div>' +
        '<figure class="stage hero-stage"><svg id="scene" role="img" aria-label="Un cambio viaja desde un ordenador hasta el servidor de producción."></svg></figure>' +
      '</div>' +
      '<h2 class="sec">Capítulos</h2><ol class="chapters">' + rows + '</ol>' +
    '</section>';
  if (demo) {
    scene = createScene($('#scene'), demo.st.scene, {});
    if (reduceMotion.matches) scene.showEnd();
  }
  updateToc();
}

/* ---------- Paso ---------- */
function renderStep(idx) {
  destroyScene();
  lastPlayLabel = '';
  current = idx;
  const S = STEPS[idx], ch = S.ch, st = S.st, total = ch.steps.length;
  if (!store.seen.includes(S.id)) store.seen.push(S.id);
  store.last = S.id;
  save();
  const prev = STEPS[idx - 1], next = STEPS[idx + 1];
  const nextCh = !next ? CHAPTERS.find(c => c.n === ch.n + 1) : null;
  view.innerHTML =
    '<article class="lesson">' +
      '<p class="crumb">Capítulo ' + ch.n + ': ' + esc(ch.title) + '<span class="step-of">Paso ' + (S.i + 1) + ' de ' + total + '</span></p>' +
      '<div class="ch-progress" aria-hidden="true"><i style="width:' + ((S.i + 1) / total * 100).toFixed(1) + '%"></i></div>' +
      '<h1>' + esc(st.term) + '</h1>' +
      (S.i === 0 ? '<p class="intro">' + esc(ch.intro) + '</p>' : '') +
      '<figure class="stage">' +
        '<svg id="scene" role="img" aria-label="Animación: ' + esc(st.short) + '"></svg>' +
        (st.say ? '<div class="cap"><button class="cap-btn" id="capPrev" type="button" aria-label="Fase anterior">' + ICON.prev + '</button>' +
          '<p id="capText" aria-live="polite"></p><span class="cap-num" id="capNum"></span>' +
          '<button class="cap-btn" id="capNext" type="button" aria-label="Fase siguiente">' + ICON.next + '</button></div>' : '') +
        '<figcaption class="stage-bar"><button class="btn quiet" id="btnPlay" type="button"></button>' +
        '<button class="btn quiet" id="btnReplay" type="button">' + ICON.replay + ' Repetir</button>' +
        (st.say ? '<button class="btn quiet toggle" id="btnStep" type="button" aria-pressed="false">Paso a paso</button>' : '') +
        '<span class="track" aria-hidden="true"><i id="track"></i><span id="ticks"></span></span></figcaption>' +
      '</figure>' +
      '<p class="rotate-hint">Consejo: gira el móvil para ver la animación más grande.</p>' +
      '<div class="text">' + st.text.map(p => '<p>' + p + '</p>').join('') + '</div>' +
      (st.real ? '<section class="real"><h2>En la vida real</h2><p>' + st.real.text + '</p>' + (st.real.code ? '<pre><code>' + esc(st.real.code) + '</code></pre>' : '') + '</section>' : '') +
      (st.more ? '<details class="more"><summary>' + ICON.plus + 'Para saber más</summary><div class="more-body">' + st.more.map(p => '<p>' + p + '</p>').join('') + '</div></details>' : '') +
      '<nav class="pager" aria-label="Pasos">' +
        (prev ? '<a class="btn" href="#' + prev.id + '" rel="prev"><span>Anterior: ' + esc(prev.st.term) + '</span></a>' : '<a class="btn" href="#inicio"><span>Inicio</span></a>') +
        (next ? '<a class="btn primary" href="#' + next.id + '" rel="next"><span>' + (next.ch !== ch ? 'Capítulo ' + next.ch.n + ': ' + esc(next.ch.title) : 'Siguiente: ' + esc(next.st.term)) + '</span></a>'
          : '<a class="btn primary" href="#inicio"><span>Volver al inicio</span></a>') +
      '</nav>' +
      (nextCh && !nextCh.steps ? '<p class="next-soon">El capítulo ' + nextCh.n + ', ' + esc(nextCh.title) + ', está en preparación.</p>' : '') +
    '</article>';
  const stepMode = store.stepMode === null || store.stepMode === undefined ? reduceMotion.matches : store.stepMode;
  scene = createScene($('#scene'), st.scene, {
    sound: name => Sound.play(name),
    say: st.say,
    stepMode,
    autoplay: !reduceMotion.matches,
    onPhase: (k, text, n) => {
      const t = $('#capText');
      if (!t) return;
      t.textContent = text;
      $('#capNum').textContent = (k + 1) + ' de ' + n;
    },
    onWait: () => syncPlay(),
  });
  const track = $('#track');
  scene.onTick = p => { track.style.width = (p * 100).toFixed(1) + '%'; syncPlay(); };
  const ticks = $('#ticks');
  if (ticks && st.say) ticks.innerHTML = scene.phaseStarts().slice(1).map(f => '<b style="left:' + (f * 100).toFixed(1) + '%"></b>').join('');
  syncPlay();
  $('#btnPlay').addEventListener('click', () => { scene.playing ? scene.pause() : scene.play(); syncPlay(); });
  $('#btnReplay').addEventListener('click', () => { scene.restart(); syncPlay(); });
  if (st.say) {
    $('#capPrev').addEventListener('click', () => { scene.prev(); syncPlay(); });
    $('#capNext').addEventListener('click', () => { scene.next(); syncPlay(); });
    const bs = $('#btnStep');
    bs.setAttribute('aria-pressed', String(stepMode));
    bs.addEventListener('click', () => {
      const v = bs.getAttribute('aria-pressed') !== 'true';
      bs.setAttribute('aria-pressed', String(v));
      store.stepMode = v; save();
      scene.setStepMode(v);
      syncPlay();
    });
  }
  updateToc();
}

let lastPlayLabel = '';
function syncPlay() {
  const b = $('#btnPlay');
  if (!b || !scene) return;
  const label = scene.playing ? 'pause' : scene.waiting ? 'continue' : 'play';
  if (label === lastPlayLabel && b.innerHTML) return;
  lastPlayLabel = label;
  b.innerHTML = label === 'pause' ? ICON.pause + ' Pausar' : label === 'continue' ? ICON.play + ' Continuar' : ICON.play + ' Reproducir';
  const n = $('#capNext');
  if (n) n.classList.toggle('nudge', scene.waiting);
}

/* ---------- Glosario ---------- */
function renderGlossary() {
  destroyScene();
  current = -1;
  const items = STEPS.map(s => ({ term: s.st.term, short: s.st.short, id: s.id, n: s.ch.n }))
    .sort((a, b) => a.term.localeCompare(b.term, 'es', { sensitivity: 'base' }));
  const soon = CHAPTERS.filter(c => !c.steps).flatMap(c => c.terms.map(t => ({ term: t, n: c.n })))
    .sort((a, b) => a.term.localeCompare(b.term, 'es', { sensitivity: 'base' }));
  view.innerHTML =
    '<section class="gloss">' +
      '<h1>Glosario</h1>' +
      '<p class="lede">Todos los conceptos del tutorial en orden alfabético. Cada uno lleva a su paso, donde está la animación que lo explica.</p>' +
      '<dl>' + items.map(i => '<div class="g-item"><dt><a href="#' + i.id + '">' + esc(i.term) + '</a></dt><dd>' + esc(i.short) + ' <span class="where">Capítulo ' + i.n + '</span></dd></div>').join('') + '</dl>' +
      (soon.length ? '<h2 class="sec">En preparación</h2><p class="soon-list">' + soon.map(s => esc(s.term)).join(', ') + '.</p>' : '') +
    '</section>';
  updateToc();
}

/* ---------- Rutas ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  document.body.classList.remove('toc-open');
  $('#btnToc').setAttribute('aria-expanded', 'false');
  if (h === 'glosario') renderGlossary();
  else {
    const idx = STEPS.findIndex(s => s.id === h);
    if (idx >= 0) renderStep(idx); else renderHome();
  }
  window.scrollTo(0, 0);
  view.focus({ preventScroll: true });
}

/* ---------- Arranque ---------- */
function init() {
  buildToc();
  window.addEventListener('hashchange', () => { Sound.play('page'); route(); });

  const unlock = () => { Sound.unlock(); Sound.setMood('read'); };
  window.addEventListener('pointerdown', unlock, { once: true });
  window.addEventListener('keydown', unlock, { once: true });
  Sound.setMood('read');

  const syncAudio = () => {
    for (const [id, kind, on, off] of [['btnMusic', 'music', ICON.music, ICON.musicOff], ['btnSfx', 'sfx', ICON.sound, ICON.soundOff]]) {
      const b = document.getElementById(id), v = Sound[kind];
      b.setAttribute('aria-pressed', String(v));
      b.innerHTML = v ? on : off;
    }
  };
  $('#btnMusic').addEventListener('click', () => { Sound.toggle('music'); syncAudio(); });
  $('#btnSfx').addEventListener('click', () => { Sound.toggle('sfx'); syncAudio(); });
  syncAudio();

  $('#btnToc').addEventListener('click', () => {
    const open = !document.body.classList.contains('toc-open');
    document.body.classList.toggle('toc-open', open);
    $('#btnToc').setAttribute('aria-expanded', String(open));
  });

  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || current < 0) return;
    const tag = e.target && e.target.tagName;
    if (e.key === 'ArrowRight' && STEPS[current + 1]) location.hash = STEPS[current + 1].id;
    else if (e.key === 'ArrowLeft' && STEPS[current - 1]) location.hash = STEPS[current - 1].id;
    else if (e.key === ' ' && tag !== 'BUTTON' && tag !== 'A' && scene) { e.preventDefault(); scene.playing ? scene.pause() : scene.play(); syncPlay(); }
  });

  route();
}

init();
window.__tut = { get scene() { return scene; }, STEPS };
</script>
